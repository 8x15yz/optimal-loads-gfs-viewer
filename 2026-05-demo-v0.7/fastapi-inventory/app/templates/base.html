<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Optimal-LOADS Preview{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f9fc;
      --surface: #ffffff;
      --surface-2: #eef6fc;
      --text: #102033;
      --muted: #5c708a;
      --line: #d7e4ef;
      --line-strong: #b9cedd;
      --brand: #0877b9;
      --brand-2: #0ea5c6;
      --green: #11855a;
      --red: #b42318;
      --amber: #a86500;
      --radius: 8px;
      --shadow: 0 8px 24px rgba(15, 42, 68, 0.08);
    }

    * { box-sizing: border-box; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.55;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .topbar-inner {
      width: min(100% - 32px, 1760px);
      min-height: 68px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brandline {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      font-weight: 800;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 8px 18px rgba(8, 119, 185, 0.22);
    }
    .brandline .title {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn:hover {
      border-color: var(--line-strong);
      background: #f8fbfd;
    }
    .btn.active,
    .btn-primary {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
    }
    .btn-soft {
      border-color: #b7dcef;
      background: var(--surface-2);
      color: #075c90;
    }
    .btn-green {
      border-color: #bfe4d3;
      background: #e9f8f1;
      color: var(--green);
    }

    .page-shell {
      width: min(100% - 32px, 1760px);
      margin: 0 auto;
      padding: 24px 0 46px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .muted { color: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--surface-2);
      color: #245a78;
      font-size: 0.78rem;
      font-weight: 900;
      white-space: nowrap;
    }
    .badge.ok { background: #e9f8f1; color: var(--green); }
    .badge.warn { background: #fff5df; color: var(--amber); }
    .badge.err { background: #fdeceb; color: var(--red); }

    @media (max-width: 760px) {
      html { font-size: 15px; }
      .topbar-inner {
        align-items: flex-start;
        flex-direction: column;
        padding: 12px 0;
      }
      .toolbar { justify-content: flex-start; }
      .btn { min-height: 40px; padding: 0 12px; }
    }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
  {% include "components/topbar.html" %}
  {% block content %}{% endblock %}
</body>
</html>
