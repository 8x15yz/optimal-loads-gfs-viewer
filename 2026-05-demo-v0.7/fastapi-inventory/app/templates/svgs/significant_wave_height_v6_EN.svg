  <!--
    파형 설계: 마루/골이 각 파의 중앙 x에 정확히 위치하도록
    파1: x=80 마루y=152, x=80 → 골은 다음 파 중간 x=160 y=236
    각 파: 시작 → 마루(cx) → 중간 → 골(cx2) → 끝
    파1: 20,200 → 마루80,148 → 140,200 → 골160,236 → 200,200
    파2: 200,200 → 마루255,124 → 310,200 → 골335,240 → 370,200
    파3(대): 370,200 → 마루420,55 → 470,200 → 골490,242 → 530,200
    파4(대): 530,200 → 마루580,80 → 630,200 → (끝640,200)
    골4: x=605, y=236 (파4 마루 오른쪽)
  -->

