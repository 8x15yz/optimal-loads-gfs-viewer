name: Deploy demo v0.7

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 (demo v0.7)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            PROJECT_ROOT="$HOME/optimal-loads-gfs-viewer"
            DEMO_DIR="$PROJECT_ROOT/2026-05-demo-v0.7"
            VENV="$DEMO_DIR/.venv"

            # Update code
            cd "$PROJECT_ROOT"
            git fetch origin
            git checkout -B main origin/main
            git pull origin main

            # Install/update dependencies
            "$VENV/bin/pip" install -q -r "$DEMO_DIR/fastapi-inventory/requirements.txt"

            # Restart FastAPI service
            sudo systemctl restart weather-api