name: Deploy demo v0.7

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 (demo v0.7)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            PROJECT_ROOT="$HOME/optimal-loads-gfs-viewer"
            DEMO_DIR="$PROJECT_ROOT/2026-05-demo-v0.7"
            ENV_FILE="$DEMO_DIR/.env_runtime"

            # Update code
            cd "$PROJECT_ROOT"
            git fetch origin
            git reset --hard origin/main

            # Deploy FastAPI
            cd "$DEMO_DIR/fastapi-inventory"

            sudo docker rm -f demo-v0-7-api 2>/dev/null || true
            sudo docker build --no-cache -t demo-v0-7-api:latest .

            sudo docker run -d \
              --name demo-v0-7-api \
              --restart=always \
              --env-file "$ENV_FILE" \
              -p 8080:8000 \
              demo-v0-7-api:latest