name: Deploy fastapi-inventory

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            PROJECT_ROOT="$HOME/optimal-loads-gfs-viewer"
            DEMO_DIR="$PROJECT_ROOT/2026-01-demo-v0.5"
            ENV_PATH="$DEMO_DIR/.env_runtime"

            # ✅ Secret(멀티라인 env 내용) -> 서버에 파일로 생성
            cat > "$ENV_PATH" <<'EOF'
            ${{ secrets.ENV_05_DEPLOY }}
            EOF
            chmod 600 "$ENV_PATH"

            cd "$PROJECT_ROOT"
            git fetch origin
            git checkout main
            git reset --hard origin/main
            git clean -fd

            cd "$DEMO_DIR/fastapi-inventory"

            sudo docker rm -f fastapi-inventory 2>/dev/null || true

            # (선택) prune은 일단 빼는 걸 추천. 다른 이미지까지 날릴 수 있음.
            # sudo docker image prune -f
            # sudo docker builder prune -f

            sudo docker build --no-cache -t fastapi-inventory:latest .

            sudo docker run -d --name fastapi-inventory \
              --restart=always \
              --env-file "$ENV_PATH" \
              -p 80:8000 \
              fastapi-inventory:latest
