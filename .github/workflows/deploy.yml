name: Deploy fastapi-inventory

on:
  push:
    branches: 
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            PROJECT_ROOT="$HOME/optimal-loads-gfs-viewer"
            DEMO_DIR="$PROJECT_ROOT/2026-01-demo-v0.5"
            ENV_FILE= ${{ secrets.ENV_05_DEPLOY }}

            cd "$PROJECT_ROOT"
            git pull 
            cd "$DEMO_DIR/fastapi-inventory"

            sudo docker rm -f fastapi-inventory 2>/dev/null || true
            sudo docker image rm -f fastapi-inventory:latest 2>/dev/null || true
            sudo docker image prune -f
            sudo docker builder prune -f

            sudo docker build --no-cache -t fastapi-inventory:latest .
            sudo docker run -d --name fastapi-inventory \
              --restart=always \
              --env-file "$ENV_FILE" \
              -p 80:8000 \
              fastapi-inventory:latest
