name: Deploy fastapi-inventory

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #     - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd "${{ secrets.EC2_PATH }}"

            git pull

            sudo docker rm -f fastapi-inventory 2>/dev/null || true
            sudo docker image rm -f fastapi-inventory:latest 2>/dev/null || true
            sudo docker image prune -f
            sudo docker builder prune -f

            sudo docker build --no-cache -t fastapi-inventory:latest .
            sudo docker run -d --name fastapi-inventory \
              --restart=always \
              --env-file .env \
              -p 80:8000 \
              fastapi-inventory:latest
