name: Deploy demo v0.6

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 수동 실행도 가능하게 유지

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 (demo v0.6)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.V04_EC2_HOST }}
          username: ubuntu  # ← ec2-user에서 ubuntu로 변경
          key: ${{ secrets.V04_EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            
            PROJECT_ROOT="$HOME/optimal-loads-gfs-viewer"
            DEMO_DIR="$PROJECT_ROOT/2026-01-demo-v0.6"
            AIRFLOW_DATA="$HOME/airflow-data"
            ENV_FILE="$PROJECT_ROOT/2026-01-demo-v0.5/.env_05"

            # -------------------------------
            # Update code
            # -------------------------------
            cd "$PROJECT_ROOT"

            git fetch origin
            git checkout -B main origin/main
            git pull origin main  # ← 최신 코드 확실히 받기
            
            # ------------------------------
            # Deploy FastAPI
            # ------------------------------
            cd "$DEMO_DIR/fastapi-inventory"

            # 기존 컨테이너 정리
            docker ps -q --filter "name=demo-v0-6-api" | grep -q . && docker stop demo-v0-6-api || true
            docker rm demo-v0-6-api || true

            # 새 이미지 빌드 및 실행
            docker build -t demo-v0-6-api .
            docker run -d \
              --name demo-v0-6-api \
              -p 80:8000 \
              --env-file "$ENV_FILE" \
              --restart unless-stopped \
              demo-v0-6-api

            # 배포 확인
            echo "Waiting for container to start..."
            sleep 5
            docker ps | grep demo-v0-6-api || echo "Warning: Container not running"