name: Deploy demo v0.4

on:
  push:
    branches:
      - demo-v0.4
    paths:
      - "(2026-01) demo v0.4/**"
      - ".github/workflows/deploy-demo-v0-4.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 (demo v0.4)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.V04_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.V04_EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/optimal-loads-gfs-viewer
            git checkout demo-v0.4
            git pull

            cd "(2026-01) demo v0.4/services/fastapi-inventory"

            docker ps -q --filter "name=demo-v0-4-api" | grep -q . && docker stop demo-v0-4-api || true
            docker rm demo-v0-4-api || true

            docker build -t demo-v0-4-api .
            docker run -d \
              --name demo-v0-4-api \
              -p 80:8000 \
              --env-file .env \
              demo-v0-4-api
