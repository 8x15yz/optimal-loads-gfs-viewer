name: Deploy demo v0.4

on:
  push:
    branches:
      - demo-v0.4
    paths:
      - "(2026-01) demo v0.4/**"
      - ".github/workflows/deploy-demo-v0-4.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 (demo v0.4)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.V04_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.V04_EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            PROJECT_ROOT="$HOME/optimal-loads-gfs-viewer"
            DEMO_DIR="$PROJECT_ROOT/(2026-01) demo v0.4"
            AIRFLOW_DATA="$HOME/airflow-data"

            # -------------------------------
            # Update code
            # -------------------------------
            cd "$PROJECT_ROOT"
            git checkout demo-v0.4
            git pull

            # -------------------------------
            # Deploy FastAPI
            # -------------------------------
            cd "$DEMO_DIR/services/fastapi-inventory"

            docker ps -q --filter "name=demo-v0-4-api" | grep -q . && docker stop demo-v0-4-api || true
            docker rm demo-v0-4-api || true

            docker build -t demo-v0-4-api .
            docker run -d \
              --name demo-v0-4-api \
              -p 80:8000 \
              --env-file "$DEMO_DIR/.env_04" \
              demo-v0-4-api

            # -------------------------------
            # Deploy Airflow
            # -------------------------------
            mkdir -p "$AIRFLOW_DATA"/{dags,logs,plugins}

            # 🔹 DAG copy (ONLY ONCE, correct location)

            sudo chown -R ec2-user:ec2-user "$AIRFLOW_DATA"

            cp "$DEMO_DIR/orchestration/airflow/dags/"*.py \
              "$AIRFLOW_DATA/dags/"

            # 🔹 Airflow UID permission
            
            sudo chown -R 50000:0 "$AIRFLOW_DATA"

            cd "$DEMO_DIR"

            docker build -t demo-v0-4-airflow -f orchestration/airflow/Dockerfile .

            docker ps -q --filter "name=demo-v0-4-airflow-web" | grep -q . && docker stop demo-v0-4-airflow-web || true
            docker rm demo-v0-4-airflow-web || true

            docker ps -q --filter "name=demo-v0-4-airflow-scheduler" | grep -q . && docker stop demo-v0-4-airflow-scheduler || true
            docker rm demo-v0-4-airflow-scheduler || true

            docker run --rm \
              -v "$AIRFLOW_DATA:/opt/airflow" \
              --env-file "$DEMO_DIR/.env_04" \
              demo-v0-4-airflow env | grep AIRFLOW_HOME

            docker run --rm \
              -v "$AIRFLOW_DATA:/opt/airflow" \
              --env-file "$DEMO_DIR/.env_04" \
              demo-v0-4-airflow airflow users create \
                --username admin \
                --password admin \
                --firstname admin \
                --lastname admin \
                --role Admin \
                --email admin@example.com || true

              docker run -d \
                --name demo-v0-4-airflow-scheduler \
                -v "$AIRFLOW_DATA:/opt/airflow" \
                --env-file "$DEMO_DIR/.env_04" \
                demo-v0-4-airflow scheduler

              docker run -d \
                --name demo-v0-4-airflow-web \
                -p 8080:8080 \
                -v "$AIRFLOW_DATA:/opt/airflow" \
                --env-file "$DEMO_DIR/.env_04" \
                demo-v0-4-airflow webserver


