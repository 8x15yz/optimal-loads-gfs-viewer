name: Deploy demo v0.4

on:
  push:
    branches:
      - demo-v0.4
    paths:
      - "(2026-01) demo v0.4/**"
      - ".github/workflows/deploy-demo-v0-4.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 (demo v0.4)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.V04_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.V04_EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            mkdir -p ~/airflow-data/{dags,logs,plugins}
            sudo chown -R 50000:0 ~/airflow-data

            
            cd ~/optimal-loads-gfs-viewer
            git checkout demo-v0.4
            git pull

            cd "(2026-01) demo v0.4/services/fastapi-inventory"

            docker ps -q --filter "name=demo-v0-4-api" | grep -q . && docker stop demo-v0-4-api || true
            docker rm demo-v0-4-api || true

            docker build -t demo-v0-4-api .
            docker run -d \
              --name demo-v0-4-api \
              -p 80:8000 \
              --env-file ../../.env_04 \
              demo-v0-4-api
            # -------------------------------
            # Deploy Airflow (demo v0.4)
            # -------------------------------
            cd ~/optimal-loads-gfs-viewer/"(2026-01) demo v0.4"

            # Airflow data volume (host)
            mkdir -p ~/airflow-data

            docker build -t demo-v0-4-airflow -f orchestration/airflow/Dockerfile .

            docker ps -q --filter "name=demo-v0-4-airflow-web" | grep -q . && docker stop demo-v0-4-airflow-web || true
            docker rm demo-v0-4-airflow-web || true

            docker ps -q --filter "name=demo-v0-4-airflow-scheduler" | grep -q . && docker stop demo-v0-4-airflow-scheduler || true
            docker rm demo-v0-4-airflow-scheduler || true

            # DB init (idempotent, shared volume)
            docker run --rm \
              -v ~/airflow-data:/opt/airflow \
              --env-file ./.env_04 \
              demo-v0-4-airflow airflow db init

            docker run --rm \
              -v ~/airflow-data:/opt/airflow \
              --env-file ./.env_04 \
              demo-v0-4-airflow airflow users create \
                --username admin \
                --password admin \
                --firstname admin \
                --lastname admin \
                --role Admin \
                --email admin@example.com || true

            # scheduler
            docker run -d \
              --name demo-v0-4-airflow-scheduler \
              -v ~/airflow-data:/opt/airflow \
              --env-file ./.env_04 \
              demo-v0-4-airflow scheduler

            # webserver
            docker run -d \
              --name demo-v0-4-airflow-web \
              -p 8080:8080 \
              -v ~/airflow-data:/opt/airflow \
              --env-file ./.env_04 \
              demo-v0-4-airflow webserver
